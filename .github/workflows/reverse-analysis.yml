# 独立扩展：只编译一次，校验后分别打包，再发布同一批安装包；不改主应用。
name: 原生逆向扩展构建与发行

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverse-analysis.yml'
      - 'Extensions/AgentTools/ReverseAnalysis/**'
      - 'Tests/ReverseAnalysis/**'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/workflows/reverse-analysis.yml'
      - 'Extensions/AgentTools/ReverseAnalysis/**'
      - 'Tests/ReverseAnalysis/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverse-analysis-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: 构建隔离契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 检查清单门禁
        run: bash Scripts/check-checklist.sh
      - name: 验证编译隔离、版本、源码完整性与双包发行门禁
        env:
          APELIN_PROJECT_ROOT: ${{ github.workspace }}
        run: python3 -m unittest discover -s Tests/ReverseAnalysis -p 'test_*.py' -v
      - name: 检查 Python 语法
        run: python3 -m compileall -q Extensions/AgentTools/ReverseAnalysis/Scripts Tests/ReverseAnalysis

  cross-compile:
    name: iOS ${{ matrix.arch }} 交叉编译及静态核验
    needs: contracts
    # 外部 fork 的未审查代码只在托管 runner 跑契约，不进入专用构建机。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 沿用仓库的专用 Xcode 27.1 runner；没有 runner 时排队，不冒充通过。
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      APELIN_PROJECT_ROOT: ${{ github.workspace }}
      RA_CROSS_COMPILE: '1'
      RA_BUILD_TAG: ci-v1
    steps:
      - name: 读取源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 核对 Xcode 和双 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${DEVELOPER_DIR:?}" ]; then
            echo '::error::缺少约定的 Xcode 27.1，不能用其他 SDK 冒充完成检查'
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          dirname "$(xcrun --find clang)" >> "$GITHUB_PATH"
      - name: 准备独立签名工具
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
      - name: 下载并核验固定源码归档
        run: python3 -c 'import sys; sys.path.insert(0, "Extensions/AgentTools/ReverseAnalysis/Scripts"); from build_support import archives; archives()'
      - name: 编译独立原生程序并静态核验
        run: python3 Extensions/AgentTools/ReverseAnalysis/Scripts/ci_build.py --arch '${{ matrix.arch }}' --jobs 2
      - name: 保存检查产物、对应源码与许可
        uses: actions/upload-artifact@v4
        with:
          name: reverse-analysis-ios-${{ matrix.arch }}-${{ github.sha }}
          path: build/reverse-analysis/ci-artifacts/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30
      - name: 保留构建诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-analysis-logs-${{ matrix.arch }}-${{ github.sha }}
          path: build/reverse-analysis/distribution/logs/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: ${{ matrix.bootstrap }} 安装包及包内回读核验
    needs: cross-compile
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - bootstrap: roothide
            architecture: iphoneos-arm64e
            prefix: ''
          - bootstrap: rootless
            architecture: iphoneos-arm64
            prefix: /var/jb
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      APELIN_PROJECT_ROOT: ${{ github.workspace }}
      APELIN_BOOTSTRAP: ${{ matrix.bootstrap }}
      APELIN_ARCHITECTURE: ${{ matrix.architecture }}
      APELIN_PREFIX: ${{ matrix.prefix }}
      APELIN_BUILD_ID: reverse-analysis-${{ github.run_id }}-${{ matrix.bootstrap }}
      APELIN_CONFIGURATION: release
    steps:
      - name: 读取同一提交源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备静态打包工具
        env:
          APELIN_PACKAGE_DIR: ${{ runner.temp }}/reverse-analysis-packages-${{ matrix.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR:?}"
          dirname "$(xcrun --find clang)" >> "$GITHUB_PATH"
          formulae=()
          command -v dpkg-deb >/dev/null 2>&1 || formulae+=(dpkg)
          command -v ldid >/dev/null 2>&1 || formulae+=(ldid)
          if (( ${#formulae[@]} > 0 )); then
            brew install "${formulae[@]}"
          fi
          mkdir -p "${APELIN_PACKAGE_DIR:?}"
      - name: 下载同轮 arm64 切片
        uses: actions/download-artifact@v4
        with:
          name: reverse-analysis-ios-arm64-${{ github.sha }}
          path: build/reverse-analysis/ci-input/arm64
      - name: 下载同轮 arm64e 切片
        uses: actions/download-artifact@v4
        with:
          name: reverse-analysis-ios-arm64e-${{ github.sha }}
          path: build/reverse-analysis/ci-input/arm64e
      - name: 核验批次及完整源码并生成独立安装包
        env:
          APELIN_PACKAGE_DIR: ${{ runner.temp }}/reverse-analysis-packages-${{ matrix.bootstrap }}
          TMPDIR: ${{ runner.temp }}
        run: python3 Extensions/AgentTools/ReverseAnalysis/Scripts/ci_package.py --input-root build/reverse-analysis/ci-input
      - name: 保存已回读核验的安装包
        uses: actions/upload-artifact@v4
        with:
          name: reverse-analysis-debs-${{ matrix.bootstrap }}-${{ github.sha }}
          path: ${{ runner.temp }}/reverse-analysis-packages-${{ matrix.bootstrap }}/
          if-no-files-found: error
          retention-days: 30
      - name: 保留打包报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-analysis-package-logs-${{ matrix.bootstrap }}-${{ github.sha }}
          path: build/reverse-analysis/distribution/reports/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布独立插件安装包
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 读取同一提交的发行说明
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 下载本轮已核验安装包
        uses: actions/download-artifact@v4
        with:
          pattern: reverse-analysis-debs-*-${{ github.sha }}
          path: build/reverse-analysis/release
          merge-multiple: true
      - name: 复核双引导包并生成校验和
        id: release
        run: python3 Extensions/AgentTools/ReverseAnalysis/Scripts/ci_package.py --collect-release --input-root build/reverse-analysis/release
      - name: 创建独立插件预发行版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: 原生逆向分析 ${{ steps.release.outputs.version }}（CI 构建）
          body_path: ${{ steps.release.outputs.notes }}
          target_commitish: ${{ github.sha }}
          make_latest: 'false'
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/reverse-analysis/release/*.deb
            build/reverse-analysis/release/*_source.tar.gz
            build/reverse-analysis/release/*-verification.json
            build/reverse-analysis/release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
